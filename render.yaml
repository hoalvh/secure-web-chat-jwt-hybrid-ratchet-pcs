# Render Blueprint — one-click deploy of the FastAPI app + a managed PostgreSQL.
# New → Blueprint → connect this repo → pick the branch that has the latest code.
#
# It serves the API, the static frontend, and WebSocket from a single HTTPS URL,
# runs Alembic migrations on each deploy, and auto-wires DATABASE_URL.
services:
  - type: web
    name: secure-web-chat
    runtime: python
    plan: free
    branch: feature/db-and-ui-overhaul
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m alembic upgrade head && uvicorn apps.server.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: JWT_SECRET
        generateValue: true          # Render generates a strong random secret
      - key: COOKIE_SECURE
        value: "true"                # Secure cookies over HTTPS
      - key: DATABASE_URL
        fromDatabase:
          name: secure-web-chat-db
          property: connectionString

databases:
  - name: secure-web-chat-db
    plan: free
